<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cut &amp; Convert | Coming Soon</title>
  <meta name="description" content="Cut & Convert is a San Diego marketing agency for local businesses and ecommerce brands: paid media, video production, and editing built to convert.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0d0d0f; --fg:#f3f1ec; --muted:#9a978f; --accent:#ff4d2e; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body {
      background:var(--bg); color:var(--fg);
      font-family:Inter, system-ui, sans-serif;
      display:flex; align-items:center; justify-content:center;
      padding:24px; text-align:center;
    }
    main { max-width:640px; }
    .mark {
      font-family:"Space Grotesk", sans-serif; font-weight:700;
      font-size:clamp(44px, 10vw, 88px); letter-spacing:-0.03em; line-height:1;
    }
    .mark span { color:var(--accent); }
    .cut {
      display:block; width:64px; height:3px; background:var(--accent);
      margin:28px auto; transform:skewX(-30deg);
    }
    p { color:var(--muted); font-size:18px; line-height:1.6; }
    .tag {
      margin-top:12px; font-size:13px; letter-spacing:0.18em;
      text-transform:uppercase; color:var(--fg);
    }
    a { color:var(--fg); text-decoration:none; border-bottom:1px solid var(--accent); }
    .contact { margin-top:36px; font-size:15px; }
  </style>
</head>
<body>
  <main>
    <h1 class="mark">Cut <span>&amp;</span> Convert</h1>
    <i class="cut"></i>
    <p>Paid media and video for local businesses and ecommerce brands.</p>
    <p class="tag">San Diego &middot; Coming Soon</p>
    <p class="contact"><a href="mailto:shaunmalinao@gmail.com">shaunmalinao@gmail.com</a></p>
  </main>
</body>
</html>
